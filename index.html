  <defs>

        -moz-osx-font-smoothing: grayscale;

      <circle cx="0" cy="-4" r="12" fill="#14532D" stroke="#052E16" stroke-width="0.8" />
      <circle cx="0" cy="-6" r="10" fill="#15803D" />

        function selectLocation(key) {
            const data = LOCATIONS[key];
            if (!data) return;

            document.getElementById('dialogTitle').textContent = data.title;
            document.getElementById('dialogCategory').textContent = data.category;
            document.getElementById('dialogIcon').textContent = data.icon;
            document.getElementById('dialogDesc').textContent = data.desc;
            document.getElementById('dialogStatus').textContent = data.status;
            document.getElementById('dialogMapBtn').href = data.mapUrl;

            document.querySelectorAll('#unifiedFooter .hud-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + key);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            if (data.x !== undefined && data.y !== undefined) {
                const classicReticle = document.getElementById('classicReticle');
                if (classicReticle) {
                    classicReticle.setAttribute('transform', 'translate(' + data.x + ', ' + data.y + ')');
                }
                panTowards(data.x, data.y);
            }
        }

        // Pan & Zoom Engine
        let scale = 1;
        let panX = 0;
        let panY = 0;
        const container = document.getElementById('mapContainer');
        const viewport = document.getElementById('mapViewport');

        function updateTransform() {
            container.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
        }

        function zoomMap(factor) {
            const newScale = Math.min(Math.max(0.6, scale * factor), 4.5);
            scale = newScale;
            updateTransform();
        }

        function resetMapView() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function panTowards(targetX, targetY) {
            if (scale > 1.2) {
                const svgW = 1600;
                const svgH = 1000;
                const viewW = viewport.clientWidth;
                const viewH = viewport.clientHeight;
                
                panX = (viewW / 2) - (targetX / svgW * viewW) * scale;
                panY = (viewH / 2) - (targetY / svgH * viewH) * scale;
                updateTransform();
            }
        }

        // Touch & Mouse Drag Panning
        let isDragging = false;
        let startX = 0, startY = 0;
        let initialPinchDist = 0;
        let initialScale = 1;

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (initialPinchDist > 0) {
                    scale = Math.min(Math.max(0.6, initialScale * (dist / initialPinchDist)), 4.5);
                    updateTransform();
                }
            }
        }, { passive: true });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1.12 : 0.9;
            zoomMap(delta);
        }, { passive: false });

        function shareMap() {
            if (navigator.share) {
                navigator.share({
                    title: 'ผังอาคารจอดรถ ม.เกษตรศาสตร์ งานลอยกระทง 2569',
                    text: 'แผนผังอาคารจอดรถ จุดจัดงานริมสระพระพิรุณ และเส้นทางจราจร ม.เกษตรศาสตร์ (บางเขน)',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('คัดลอกลิงก์เรียบร้อยแล้ว!');
            }
        }

            const clickMap = {

                'building-sc-lab': 'sc_lab',
                'building-vipa': 'vipa',
                'roundabout-bts': 'bts',
                'building-auditorium': 'auditorium',
                'building-barmai': 'barmai',
                'building-library': 'library',
                'building-satit': 'satit',
                'building-sorn3': 'sorn3',
                'building-eng': 'eng',
                'building-econ': 'econ',
                'building-ocs': 'ocs',
                'building-stadium': 'stadium',
                'building-vetHospital': 'vetHospital',
                'building-vet-hospital': 'vetHospital',
                'building-vetTech': 'vetTech',
                'building-vet-tech': 'vetTech'
            };

            for (const [id, key] of Object.entries(clickMap)) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.cursor = 'pointer';
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectLocation(key);
                    });
                }
            }

            selectLocation('pond');
        });
    </script>
