<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" class="w-full h-auto select-none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E" />
      <stop offset="50%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <!-- Water Lake Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="40%" stop-color="#0E7490" />
      <stop offset="80%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Road Pattern & Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Isometric Building 3D Shading Gradients -->
    <!-- Vibhavadi (Amber / Gold Accent) -->
    <linearGradient id="vipaTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="vipaFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="vipaSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Ngamwongwan 1 & 2 (Emerald / Green Accent) -->
    <linearGradient id="ngamTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ngamFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="ngamSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- KU Main Auditorium Roof Gradient -->
    <linearGradient id="auditoriumRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowTeal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. BASE BACKGROUND & CAMPUS LAWN -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- Subtle Campus Grid Texture -->
  <g opacity="0.12" stroke="#475569" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200" stroke-dasharray="8,8" />
    <line x1="0" y1="400" x2="1600" y2="400" stroke-dasharray="8,8" />
    <line x1="0" y1="600" x2="1600" y2="600" stroke-dasharray="8,8" />
    <line x1="0" y1="800" x2="1600" y2="800" stroke-dasharray="8,8" />
    <line x1="300" y1="0" x2="300" y2="1000" stroke-dasharray="8,8" />
    <line x1="600" y1="0" x2="600" y2="1000" stroke-dasharray="8,8" />
    <line x1="900" y1="0" x2="900" y2="1000" stroke-dasharray="8,8" />
    <line x1="1200" y1="0" x2="1200" y2="1000" stroke-dasharray="8,8" />
  </g>

  <!-- Campus Green Zones (Park / Gardens) -->
  <path d="M 380,240 L 720,240 L 680,480 L 350,480 Z" fill="#064E3B" opacity="0.25" />
  <path d="M 850,380 L 1280,380 L 1240,650 L 800,650 Z" fill="#064E3B" opacity="0.2" />
  <path d="M 280,680 L 750,680 L 710,880 L 250,880 Z" fill="#064E3B" opacity="0.3" />

  <!-- 2. CAMPUS ROADS & HIGHWAYS -->
  <!-- Outer Vibhavadi Highway (Top/North) -->
  <g id="vibhavadi-road">
    <path d="M 0,110 L 1600,110" stroke="#1E293B" stroke-width="48" stroke-linecap="round" />
    <path d="M 0,110 L 1600,110" stroke="#F59E0B" stroke-width="2" stroke-dasharray="16,16" opacity="0.4" />
    <text x="800" y="75" fill="#94A3B8" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">
      ◄ ถนนวิภาวดีรังสิต (VIBHAVADI RANGSIT RD.) ►
    </text>
  </g>

  <!-- Outer Ngamwongwan Highway (Left/West) -->
  <g id="ngamwongwan-road">
    <path d="M 120,0 L 120,1000" stroke="#1E293B" stroke-width="54" stroke-linecap="round" />
    <path d="M 120,0 L 120,1000" stroke="#F59E0B" stroke-width="2" stroke-dasharray="16,16" opacity="0.4" />
    <text x="50" y="500" fill="#94A3B8" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" letter-spacing="3" transform="rotate(-90 50,500)" text-anchor="middle">
      ◄ ถนนงามวงศ์วาน (NGAMWONGWAN RD.) ►
    </text>
  </g>

  <!-- Internal Campus Avenues (Main Ring Roads) -->
  <g id="internal-roads" stroke="#334155" stroke-linecap="round" stroke-linejoin="round">
    <!-- North-South Avenue from Vibhavadi Gate -->
    <path d="M 880,110 L 880,880" stroke-width="36" />
    <!-- East-West Connector (Connecting Ngamwongwan to Vibhavadi) -->
    <path d="M 120,380 L 1400,380" stroke-width="32" />
    <!-- Main Center Loop around Phra Phirun Pond -->
    <path d="M 120,680 L 880,680 L 880,880 L 420,880 L 420,680" stroke-width="28" />
    <!-- Diagonal Driveways into parking structures -->
    <path d="M 120,520 L 280,520 L 280,680" stroke-width="24" />
    <path d="M 880,240 L 980,240" stroke-width="24" />
  </g>

  <!-- Road Centerlines -->
  <g stroke="#64748B" stroke-width="2" stroke-dasharray="10,12" opacity="0.5">
    <path d="M 880,130 L 880,880" />
    <path d="M 140,380 L 1400,380" />
    <path d="M 140,680 L 880,680" />
  </g>

  <!-- Pedestrian Walkway Lights (Fairy lights from parking to pond) -->
  <g id="walking-paths" stroke="#FDE047" stroke-width="3" stroke-dasharray="4,8" opacity="0.8" filter="url(#glowGold)">
    <!-- Path from Ngamwongwan 1 & 2 to Pond -->
    <path d="M 280,550 Q 420,560 550,540" fill="none" />
    <!-- Path from Vibhavadi to Pond -->
    <path d="M 980,280 Q 880,380 720,490" fill="none" />
  </g>

  <!-- 3. CENTRAL LOY KRATHONG EVENT ZONE -->

  <!-- Phra Phirun Central Pond (สระพระพิรุณ) -->
  <g id="pond-zone" filter="url(#dropShadow)">
    <!-- Pond Outer Bank / Stone Rim -->
    <ellipse cx="640" cy="530" rx="190" ry="105" fill="#1E293B" stroke="#0E7490" stroke-width="4" />
    <!-- Water Body -->
    <ellipse cx="640" cy="530" rx="180" ry="96" fill="url(#waterGrad)" />
    
    <!-- Water Ripple Reflections -->
    <ellipse cx="640" cy="530" rx="140" ry="70" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    <ellipse cx="640" cy="530" rx="90" ry="42" fill="none" stroke="#67E8F9" stroke-width="1" opacity="0.6" />

    <!-- Wooden Piers for Floating Krathongs (ท่าน้ำปล่อยกระทง) -->
    <rect x="520" y="605" width="40" height="25" rx="3" fill="#78350F" stroke="#B45309" stroke-width="1.5" />
    <rect x="620" y="615" width="45" height="26" rx="3" fill="#78350F" stroke="#B45309" stroke-width="1.5" />
    <rect x="720" y="605" width="40" height="25" rx="3" fill="#78350F" stroke="#B45309" stroke-width="1.5" />

    <!-- Floating Krathongs (Glowing lotus lanterns on water) -->
    <!-- Krathong 1 -->
    <g transform="translate(590, 510)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="7" fill="#F59E0B" />
      <polygon points="0,-12 4,-3 12,-1 5,5 6,13 0,8 -6,13 -5,5 -12,-1 -4,-3" fill="#FCD34D" />
      <circle cx="0" cy="-2" r="2.5" fill="#EF4444" />
    </g>
    <!-- Krathong 2 -->
    <g transform="translate(670, 540)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="8" fill="#F59E0B" />
      <polygon points="0,-14 5,-4 14,-1 6,6 7,15 0,9 -7,15 -6,6 -14,-1 -5,-4" fill="#FBBF24" />
      <circle cx="0" cy="-2" r="3" fill="#EF4444" />
    </g>
    <!-- Krathong 3 -->
    <g transform="translate(620, 560)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="6" fill="#F59E0B" />
      <polygon points="0,-10 3,-3 10,-1 4,4 5,11 0,7 -5,11 -4,4 -10,-1 -3,-3" fill="#FDE047" />
    </g>
    <!-- Krathong 4 -->
    <g transform="translate(710, 500)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="5" fill="#F59E0B" />
      <polygon points="0,-8 3,-2 8,-1 4,3 4,9 0,6 -4,9 -4,3 -8,-1 -3,-2" fill="#FDE047" />
    </g>
  </g>

  <!-- KU Main Auditorium (หอประชุมใหญ่ มก.) Adjacent to Pond -->
  <g id="auditorium-building" transform="translate(640, 370)" filter="url(#dropShadow)">
    <!-- Base Platform -->
    <polygon points="-110,30 110,30 140,55 -80,55" fill="#334155" />
    <!-- Building Walls -->
    <polygon points="-100,-10 100,-10 100,30 -100,30" fill="#E2E8F0" />
    <polygon points="100,-10 130,10 130,50 100,30" fill="#94A3B8" />
    <!-- Iconic Thai Gable Roof -->
    <polygon points="0,-60 -120,-10 120,-10" fill="url(#auditoriumRoof)" stroke="#FFE4E6" stroke-width="2" />
    <polygon points="0,-60 120,-10 145,5 30,-45" fill="#881337" />
    <!-- Text Badge -->
    <rect x="-65" y="4" width="130" height="20" rx="4" fill="#0F172A" opacity="0.9" />
    <text x="0" y="18" fill="#FDE047" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      🏛️ หอประชุมใหญ่ มก.
    </text>
  </g>

  <!-- Festival Market & Stage Zone (โซนตลาดย้อนยุค & เวทีกลาง) -->
  <g id="market-zone" transform="translate(520, 680)">
    <!-- Colorful Food Tents -->
    <!-- Tent 1 (Yellow) -->
    <polygon points="0,0 24,-16 48,0 24,12" fill="#EAB308" filter="url(#dropShadow)" />
    <!-- Tent 2 (Red) -->
    <polygon points="56,0 80,-16 104,0 80,12" fill="#EF4444" filter="url(#dropShadow)" />
    <!-- Tent 3 (Blue) -->
    <polygon points="112,0 136,-16 160,0 136,12" fill="#3B82F6" filter="url(#dropShadow)" />
    <!-- Tent 4 (Green) -->
    <polygon points="168,0 192,-16 216,0 192,12" fill="#10B981" filter="url(#dropShadow)" />
    <!-- Tent 5 (Purple) -->
    <polygon points="224,0 248,-16 272,0 248,12" fill="#8B5CF6" filter="url(#dropShadow)" />

    <!-- Fairy String Lights hanging along the market -->
    <path d="M 0,-5 Q 60,10 120,-5 Q 180,10 270,-5" fill="none" stroke="#FEF08A" stroke-width="2" stroke-dasharray="3,6" filter="url(#glowGold)" />
  </g>


  <!-- 4. THE 3 AUTHORIZED PARKING BUILDINGS (ISOMETRIC 3D) -->

  <!-- [1] อาคารจอดรถงามวงศ์วาน 1 (Lower-Left) -->
  <g id="building-ngam1" transform="translate(230, 620)" filter="url(#dropShadow)">
    <!-- Ground Shadow -->
    <polygon points="-75,45 65,45 95,85 -45,85" fill="#000000" opacity="0.5" />
    <!-- Left Front Face -->
    <polygon points="-60,10 40,10 40,65 -60,65" fill="url(#ngamFront)" />
    <!-- Right Side Face -->
    <polygon points="40,10 85,-15 85,40 40,65" fill="url(#ngamSide)" />
    <!-- Rooftop Parking Deck (Top Face) -->
    <polygon points="-60,10 40,10 85,-15 -15,-15" fill="url(#ngamTop)" stroke="#A7F3D0" stroke-width="2" />
    
    <!-- Parking Slot Markings on Roof -->
    <line x1="-30" y1="3" x2="50" y2="-10" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
    <line x1="-15" y1="7" x2="65" y2="-6" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />

    <!-- Glowing Label Plaque -->
    <rect x="-55" y="24" width="90" height="24" rx="5" fill="#022C22" stroke="#10B981" stroke-width="1.5" />
    <text x="-10" y="40" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      งามวงศ์วาน 1
    </text>
  </g>


  <!-- [2] อาคารจอดรถงามวงศ์วาน 2 (Adjacent to Ngam 1) -->
  <g id="building-ngam2" transform="translate(250, 410)" filter="url(#dropShadow)">
    <!-- Ground Shadow -->
    <polygon points="-75,45 65,45 95,85 -45,85" fill="#000000" opacity="0.5" />
    <!-- Left Front Face -->
    <polygon points="-60,5 40,5 40,60 -60,60" fill="url(#ngamFront)" />
    <!-- Right Side Face -->
    <polygon points="40,5 85,-20 85,35 40,60" fill="url(#ngamSide)" />
    <!-- Rooftop Parking Deck (Top Face) -->
    <polygon points="-60,5 40,5 85,-20 -15,-20" fill="url(#ngamTop)" stroke="#A7F3D0" stroke-width="2" />
    
    <!-- Parking Slot Markings on Roof -->
    <line x1="-30" y1="-2" x2="50" y2="-15" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
    <line x1="-15" y1="2" x2="65" y2="-11" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />

    <!-- Glowing Label Plaque -->
    <rect x="-55" y="19" width="90" height="24" rx="5" fill="#022C22" stroke="#10B981" stroke-width="1.5" />
    <text x="-10" y="35" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      งามวงศ์วาน 2
    </text>
  </g>


  <!-- [3] อาคารจอดรถวิภาวดี (Top-Right / North-East) -->
  <g id="building-vipa" transform="translate(1050, 240)" filter="url(#dropShadow)">
    <!-- Ground Shadow -->
    <polygon points="-110,65 90,65 140,115 -60,115" fill="#000000" opacity="0.5" />
    <!-- Left Front Face (Large 8-Storey Parking Structure) -->
    <polygon points="-90,0 60,0 60,75 -90,75" fill="url(#vipaFront)" />
    <!-- Right Side Face -->
    <polygon points="60,0 120,-35 120,40 60,75" fill="url(#vipaSide)" />
    <!-- Rooftop Parking Deck (Top Face) -->
    <polygon points="-90,0 60,0 120,-35 -30,-35" fill="url(#vipaTop)" stroke="#FDE68A" stroke-width="2.5" />
    
    <!-- Floor Louvers / Ventilation Slits for Realism -->
    <line x1="-80" y1="20" x2="50" y2="20" stroke="#451A03" stroke-width="3" />
    <line x1="-80" y1="38" x2="50" y2="38" stroke="#451A03" stroke-width="3" />
    <line x1="-80" y1="56" x2="50" y2="56" stroke="#451A03" stroke-width="3" />

    <!-- Parking Slot Markings on Roof -->
    <line x1="-50" y1="-12" x2="70" y2="-28" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.9" />

    <!-- Glowing Label Plaque -->
    <rect x="-70" y="22" width="115" height="30" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="2" />
    <text x="-12" y="42" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      อาคารวิภาวดี
    </text>
  </g>

  <!-- 5. RESTRICTED ZONE: อาคารบางเขน (Marked Dimmed / Closed) -->
  <g id="building-bangkhen-closed" transform="translate(1360, 520)" opacity="0.35">
    <polygon points="-50,0 40,0 70,-20 -20,-20" fill="#475569" stroke="#94A3B8" />
    <polygon points="-50,0 40,0 40,40 -50,40" fill="#334155" />
    <polygon points="40,0 70,-20 70,20 40,40" fill="#1E293B" />
    <text x="-5" y="25" fill="#EF4444" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      (งดจอด)
    </text>
  </g>

  <!-- 6. CAMPUS TREES & FOLIAGE (2.5D Isometric Trees) -->
  <g id="trees" filter="url(#dropShadow)">
    <!-- Group near pond -->
    <g transform="translate(460, 480)">
      <circle cx="0" cy="0" r="16" fill="#047857" />
      <circle cx="-3" cy="-4" r="12" fill="#10B981" />
    </g>
    <g transform="translate(485, 520)">
      <circle cx="0" cy="0" r="14" fill="#065F46" />
      <circle cx="-2" cy="-3" r="10" fill="#059669" />
    </g>
    <g transform="translate(810, 470)">
      <circle cx="0" cy="0" r="18" fill="#047857" />
      <circle cx="-3" cy="-4" r="13" fill="#10B981" />
    </g>
    <g transform="translate(835, 510)">
      <circle cx="0" cy="0" r="15" fill="#065F46" />
      <circle cx="-2" cy="-3" r="11" fill="#059669" />
    </g>
    <!-- Group along Ngamwongwan road -->
    <g transform="translate(180, 320)">
      <circle cx="0" cy="0" r="14" fill="#047857" />
      <circle cx="-2" cy="-3" r="10" fill="#10B981" />
    </g>
    <g transform="translate(180, 520)">
      <circle cx="0" cy="0" r="14" fill="#047857" />
      <circle cx="-2" cy="-3" r="10" fill="#10B981" />
    </g>
    <g transform="translate(180, 720)">
      <circle cx="0" cy="0" r="14" fill="#047857" />
      <circle cx="-2" cy="-3" r="10" fill="#10B981" />
    </g>
    <!-- Group along Vibhavadi road -->
    <g transform="translate(760, 160)">
      <circle cx="0" cy="0" r="15" fill="#047857" />
      <circle cx="-2" cy="-3" r="11" fill="#10B981" />
    </g>
    <g transform="translate(1220, 160)">
      <circle cx="0" cy="0" r="15" fill="#047857" />
      <circle cx="-2" cy="-3" r="11" fill="#10B981" />
    </g>
  </g>

  <!-- 7. CAMPUS GATES (ENTRANCES) -->
  <!-- Pratu Ngamwongwan 1 -->
  <g transform="translate(120, 780)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="5" fill="#FDE047" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="25" y="4" fill="#CBD5E1" font-family="'Prompt', sans-serif" font-size="11" font-weight="600">ประตูงามวงศ์วาน 1</text>
  </g>

  <!-- Pratu Ngamwongwan 2 -->
  <g transform="translate(120, 480)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="5" fill="#FDE047" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="25" y="4" fill="#CBD5E1" font-family="'Prompt', sans-serif" font-size="11" font-weight="600">ประตูงามวงศ์วาน 2</text>
  </g>

  <!-- Pratu Ngamwongwan 3 -->
  <g transform="translate(120, 260)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="5" fill="#FDE047" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="25" y="4" fill="#CBD5E1" font-family="'Prompt', sans-serif" font-size="11" font-weight="600">ประตูงามวงศ์วาน 3</text>
  </g>

  <!-- Pratu Vibhavadi Rangsit -->
  <g transform="translate(880, 110)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="5" fill="#FDE047" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" text-anchor="middle">V</text>
    <text x="22" y="5" fill="#CBD5E1" font-family="'Prompt', sans-serif" font-size="11" font-weight="600">ประตูวิภาวดีรังสิต</text>
  </g>

  <!-- Compass Rose (North Arrow) -->
  <g transform="translate(1500, 80)" opacity="0.7">
    <circle cx="0" cy="0" r="28" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <polygon points="0,-22 7,0 0,-5 -7,0" fill="#EF4444" />
    <polygon points="0,22 7,0 0,5 -7,0" fill="#94A3B8" />
    <text x="0" y="-8" fill="#F1F5F9" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" text-anchor="middle">N</text>
  </g>
</svg>
